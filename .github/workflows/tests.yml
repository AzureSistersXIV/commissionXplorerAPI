name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile:
          - performance
          - sit
          - uat
          - qa
          - security
          - chaos
          - alpha
          - beta
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick

      - name: Run ${{ matrix.profile }} profile and write log
        id: tests
        shell: bash
        run: |
          set -o pipefail
          printf 'API test profile: %s\nRun: %s\nCommit: %s\n\n' \
            "${{ matrix.profile }}" "$GITHUB_RUN_ID" "$GITHUB_SHA" | tee test.log
          sh ./run-tests.sh "${{ matrix.profile }}" 2>&1 | tee -a test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: api-test-log-${{ matrix.profile }}-${{ github.run_id }}
          path: test.log
          if-no-files-found: warn
          retention-days: 30

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          TEST_PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Discord notification skipped; configure the DISCORD_WEBHOOK_URL repository secret."
            echo "Discord notification skipped: add the repository Actions secret \`DISCORD_WEBHOOK_URL\`." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY' > discord-payload.json
          import json
          import os

          run_url = os.environ["RUN_URL"]
          payload = {
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"GitHub Actions SUCCEEDED — run {os.environ['RUN_ID']}",
                  "url": run_url,
                  "description": (
                      f"**API tests:** {os.environ['TEST_RESULT']}\n"
                      f"**Profile:** {os.environ['TEST_PROFILE']}\n"
                      f"[Workflow run]({run_url})"
                  ),
                  "color": 0x2ECC71,
                  "footer": {
                      "text": (
                          f"Attempt {os.environ['RUN_ATTEMPT']} · "
                          f"commit {os.environ['COMMIT_SHA'][:7]}"
                      )
                  },
              }],
          }
          print(json.dumps(payload))
          PY

          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' \
            --data-binary @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
