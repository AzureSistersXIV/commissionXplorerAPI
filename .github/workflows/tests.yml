name: API tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile:
          - performance
          - sit
          - uat
          - qa
          - security
          - chaos
          - alpha
          - beta
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: imagick

      - name: Run ${{ matrix.profile }} profile and write log
        id: tests
        shell: bash
        run: |
          set -o pipefail
          log_file="test-${{ matrix.profile }}.log"
          printf 'API test profile: %s\nRun: %s\nCommit: %s\n\n' \
            "${{ matrix.profile }}" "$GITHUB_RUN_ID" "$GITHUB_SHA" | tee "$log_file"
          sh ./run-tests.sh "${{ matrix.profile }}" 2>&1 | tee -a "$log_file"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -eq 0 ]; then
            echo "Result: PASSED" | tee -a "$log_file"
          else
            echo "Result: FAILED (exit code $test_status)" | tee -a "$log_file"
          fi
          exit "$test_status"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-log-${{ matrix.profile }}-${{ github.run_id }}
          path: test-${{ matrix.profile }}.log
          if-no-files-found: warn
          retention-days: 30

  notify:
    runs-on: ubuntu-24.04
    needs: test
    if: always()
    steps:
      - name: Download test logs
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: api-test-log-*-${{ github.run_id }}
          path: test-logs
          merge-multiple: true

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_PROFILES: performance,sit,uat,qa,security,chaos,alpha,beta
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Discord notification skipped; configure the DISCORD_WEBHOOK_URL repository secret."
            echo "Discord notification skipped: add the repository Actions secret \`DISCORD_WEBHOOK_URL\`." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run_url = os.environ["RUN_URL"]
          log_files = sorted(Path("test-logs").glob("test-*.log"))
          logs_by_profile = {
              log_file.stem.removeprefix("test-"): log_file for log_file in log_files
          }
          combined_log = Path("combined-test-logs.txt")
          summaries = []

          with combined_log.open("w", encoding="utf-8") as output:
              for log_file in log_files:
                  content = log_file.read_text(encoding="utf-8", errors="replace")
                  output.write(f"\n{'=' * 20} {log_file.stem} {'=' * 20}\n")
                  output.write(content)
                  if not content.endswith("\n"):
                      output.write("\n")

          for profile in os.environ["TEST_PROFILES"].split(","):
              log_file = logs_by_profile.get(profile)
              if log_file is None:
                  result = "LOG MISSING"
              else:
                  content = log_file.read_text(encoding="utf-8", errors="replace")
                  if "Result: FAILED" in content:
                      result = "FAILED"
                  elif "Result: PASSED" in content:
                      result = "PASSED"
                  else:
                      result = "INCOMPLETE"
              summaries.append(f"{profile}: {result}")

          test_result = os.environ["TEST_RESULT"]
          failed = test_result in ("failure", "cancelled") or any(
              result.endswith(("FAILED", "LOG MISSING", "INCOMPLETE"))
              for result in summaries
          )
          outcome = "FAILED" if failed else "SUCCEEDED"
          description = f"**Repository:** {os.environ['REPOSITORY']}\n"
          description += "\n".join(f"**{summary}**" for summary in summaries)
          description += f"\n[Workflow run and logs]({run_url})"

          payload = {
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"GitHub Actions {outcome} — run {os.environ['RUN_ID']}",
                  "url": run_url,
                  "description": description,
                  "color": 0x2ECC71 if not failed else 0xE74C3C,
                  "footer": {
                      "text": (
                          f"Attempt {os.environ['RUN_ATTEMPT']} · "
                          f"commit {os.environ['COMMIT_SHA'][:7]}"
                      )
                  },
              }],
          }
          Path("discord-payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl --fail --silent --show-error --max-time 30 \
            -F 'payload_json=<discord-payload.json' \
            -F 'files[0]=@combined-test-logs.txt;type=text/plain' \
            "$DISCORD_WEBHOOK_URL"
